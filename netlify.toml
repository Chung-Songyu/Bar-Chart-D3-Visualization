# (Netlify deployment) This file is used solely for deployment to Netlify
# https://docs.netlify.com/build/frameworks/framework-setup-guides/express/

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  included_files = ["public/data.json"]

# Url endpoint ending in "/api/data" is redirected to "/api/data" routing in "/netlify/functions/server.js"
[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/server/api/data"
  force = true
  status = 200

# Catch-all for invalid url endpoints - Error page
[[redirects]]
  from = "/*"
  to = "/html/error.html"
  status = 404